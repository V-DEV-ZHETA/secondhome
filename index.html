<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Home - Kamus Kopi Anda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABEL WARNA & GLOBAL --- */
        :root {
            --primary-dark: #151515;
            --accent-red: #A63D40;
            --accent-gold: #E9B872;
            --light-gold: #f5d4a1;
            --text-light: #f4f4f4;
            --bg-card: #2c2c2c;
            --bg-section: #1e1e1e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- TYPOGRAPHY --- */
        h1, h2, h3 {
            color: var(--accent-gold);
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent-red);
        }

        /* --- HEADER & NAV BAR BARU --- */
.main-header {
    background-color: rgba(21, 21, 21, 0.85);
    padding: 0.8rem 0;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
}

/* Layout container header */
.main-header .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.5rem;
}

/* Logo */
.logo {
    color: var(--accent-gold);
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: 1px;
}

/* Nav wrapper */
.main-nav ul {
    list-style: none;
    display: flex;
    gap: 1.2rem;
    align-items: center;
}

/* Link tampilan rapi */
.main-nav a {
    color: var(--text-light);
    text-decoration: none;
    font-weight: 500;
    padding: 0.55rem 1rem;
    border-radius: 8px;
    display: inline-block;
    transition: all .25s ease;
    font-size: 0.95rem;
}

/* Hover & active state */
.main-nav a:hover,
.main-nav a.active {
    background-color: var(--accent-red);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(166, 61, 64, 0.4);
}

/* Responsif untuk HP */
@media (max-width: 768px) {
    .main-header .container {
        flex-direction: column;
        align-items: flex-start;
    }

    .main-nav ul {
        flex-wrap: wrap;
        gap: 0.6rem;
    }

    .main-nav a {
        padding: 0.5rem 0.8rem;
        font-size: 0.9rem;
    }
}


        /* --- PAGE WRAPPER --- */
        #app-content {
            margin-top: 80px;
        }

        .page { display: none; padding: 2rem 0; }
        .active-page { display: block; }

        /* --- HERO --- */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=2070')
            no-repeat center/cover;
            color: var(--text-light);
            text-align: center;
            padding: 6rem 0;
            margin-bottom: 3rem;
        }

        .hero h2 {
            font-size: 3rem;
            border: none;
        }

        /* --- QUICK CARD --- */
        .quick-access {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .quick-card {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-light);
            border: 1px solid transparent;
            transition: .3s;
        }

        .quick-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-gold);
        }

    </style>
</head>
<body>

<header class="main-header">

        <h1 class="logo">Second Home</h1>
        <nav class="main-nav">

                <li><a href="#" data-target="kamus-page" class="nav-link">Kamus Kopi</a></li>

</main>

        <span class="close-btn">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<footer class="main-footer">
    <div class="container">
        <p>&copy; 2024 Second Home.</p>
    </div>
</footer>

    const processes = [

        },
        {

            disadvantages: 'Proses pengeringan yang sulit dan membutuhkan tenaga kerja lebih banyak.'
        }
    ];

    const roastLevels = [
        {
            id: 'light',
            name: 'Light Roast',
            image: 'https://images.unsplash.com/photo-1511920183353-3c9c3a6c1c31?q=80&w=2070',
            description: 'Disangrai hingga "first crack" selesai. Warna biji masih cokelat muda, permukaan kering.',
            flavor: 'Asam tinggi, aroma buah dan floral yang dominan, body ringan.',
            suitableFor: 'Pour-over, Aeropress, Cold Brew.'
        },
        {
            id: 'medium',
            name: 'Medium Roast',
            image: 'https://images.unsplash.com/photo-1587953006225-bb1597b511f5?q=80&w=2070',
            description: 'Disangrai di tengah-tengah "first crack" dan "second crack". Keseimbangan antara asam, manis, dan pahit.',
            flavor: 'Keseimbangan rasa, asam sedang, karamel dan cokelat mulai terasa.',
            suitableFor: 'Metode seduh apa saja, sangat umum untuk kopi rumah.'
        },
        {
            id: 'dark',
            name: 'Dark Roast',
            image: 'https://images.unsplash.com/photo-1511538194211-4d64a9ba5c2b?q=80&w=2070',
            description: 'Disangrai melewati "second crack". Warna biji sangat gelap, permukaan berminyak.',
            flavor: 'Asam rendah, rasa pahit dan gosong (smoky) yang dominan, body pekat.',
            suitableFor: 'Espresso, French Press, Moka Pot.'
        }
    ];
    
    const brewingMethods = [
        {
            id: 'v60',
            name: 'V60 / Pour-Over',
            image: 'https://images.unsplash.com/photo-1579668158175-71e8b7258854?q=80&w=2070',
            grindSize: 'Medium-fine',
            ratio: '1:15 (misal 18g kopi, 270g air)',
            time: '2.5 - 3 menit',
            flavor: 'Bersih, kompleks, highlight keasaman.'
        },
        {
            id: 'french-press',
            name: 'French Press',
            image: 'https://images.unsplash.com/photo-1511920183353-3c9c3a6c1c31?q=80&w=2070',
            grindSize: 'Coarse',
            ratio: '1:15 (misal 30g kopi, 450g air)',
            time: '4 menit',
            flavor: 'Full-bodied, pekat, tekstur berminyak.'
        },
        {
            id: 'aeropress',
            name: 'Aeropress',
            image: 'https://images.unsplash.com/photo-1597392639363-2c8b2a5d4a4b?q=80&w=2070',
            grindSize: 'Fine-medium',
            ratio: '1:15 (misal 15g kopi, 225g air)',
            time: '1.5 - 2 menit',
            flavor: 'Bersih, pekat, fleksibel (bisa mirip espresso atau filter).'
        },
        {
            id: 'cold-brew',
            name: 'Cold Brew',
            image: 'https://images.unsplash.com/photo-1551036351-fb34e1bb59e3?q=80&w=1974',
            grindSize: 'Very Coarse',
            ratio: '1:8 (misal 100g kopi, 800g air)',
            time: '12 - 24 jam (rendaman)',
            flavor: 'Sangat rendah asam, manis, halus.'
        }
    ];

    const coffeeDrinks = [
        {
            id: 'espresso',
            name: 'Espresso',
            image: 'https://images.unsplash.com/photo-1541167760496-1628856ab772?q=80&w=1974',
            composition: 'Satu shot (30ml) kopi pekat.',
            flavor: 'Intens, pekat, lapisan crema di atas.',
            milkRatio: { coffee: 100, milk: 0 }
        },
        {
            id: 'americano',
            name: 'Americano',
            image: 'https://images.unsplash.com/photo-1564890369478-c89ca6d9cda9?q=80&w=2070',

            flavor: 'Mirip espresso namun lebih encer dan ringan.',
            milkRatio: { coffee: 100, milk: 0 }
        },
        {
            id: 'cappuccino',
            name: 'Cappuccino',
            image: 'https://images.unsplash.com/photo-1534778101976-628808918e88?q=80&w=2070',
            composition: 'Espresso + susu uap + busa susu (rasio 1:1:1).',
            flavor: 'Seimbang antara rasa kopi dan susu.',
            milkRatio: { coffee: 33, milk: 67 }
        },
        {
            id: 'latte',
            name: 'Café Latte',

            milkRatio: { coffee: 20, milk: 80 }
        }
    ];

    const articles = [
        {
            id: 'artikel-1',

        },
        {
            id: 'artikel-2',
            title: 'Cara Menyimpan Biji Kopi Agar Awet',
            summary: 'Pelajari cara terbaik menyimpan biji kopi agar tetap segar dan aromatik.',
            image: 'https://images.unsplash.com/photo-1587049352846-4a222e784d38?q=80&w=2070'
        },
        {
            id: 'artikel-3',

        }

    // --- FUNGSI UTAMA ---

    // 1. Navigasi Halaman (SPA)
    const showPage = (pageId) => {
        pages.forEach(page => page.classList.remove('active-page'));
        navLinks.forEach(link => link.classList.remove('active'));
        
        document.getElementById(pageId).classList.add('active-page');
        document.querySelector(`[data-target="${pageId}"]`).classList.add('active');
    };

    // 2. Modal
    const showModal = (content) => {
        modalBody.innerHTML = content;
        modal.style.display = 'block';
        document.body.style.overflow = 'hidden'; // Mencegah scroll di background
    };

    const closeModal = () => {
        modal.style.display = 'none';
        modalBody.innerHTML = ''; // Kosongkan konten saat ditutup
        document.body.style.overflow = 'auto'; // Kembalikan scroll
    };

    // 3. Fungsi untuk Membuat Konten Dinamis
    const createCard = (item, type) => {
        const card = document.createElement('div');
        card.classList.add('card');
        
        let cardContent = `
            <img src="${item.image}" alt="${item.name}" class="card-img">
            <div class="card-body">
                <h3>${item.name}</h3>
        `;
        
        if (type === 'drinks' && item.milkRatio) {
            cardContent += `
                <div class="milk-ratio-chart">
                    <div class="coffee-part" style="width: ${item.milkRatio.coffee}%"></div>
                    <div class="milk-part" style="width: ${item.milkRatio.milk}%"></div>
                </div>
            `;
        }

        cardContent += `<p>${item.summary || item.flavor || item.description}</p></div>`;
        card.innerHTML = cardContent;

        card.addEventListener('click', () => {
            let detailContent = `<img src="${item.image}" alt="${item.name}"><h2>${item.name}</h2>`;
            // Logika untuk menampilkan detail berbeda berdasarkan tipe
            if (type === 'beans') {
                detailContent += `
                    <p><strong>Karakter Rasa:</strong> ${item.flavor}</p>
                    <p><strong>Kandungan Kafein:</strong> ${item.caffeine}</p>
                    <p><strong>Keunggulan:</strong> ${item.advantages}</p>
                    <p><strong>Kekurangan:</strong> ${item.disadvantages}</p>
                    <p><strong>Lokasi Utama:</strong> ${item.location}</p>
                `;
            } else if (type === 'processes') {
                detailContent += `
                    <p>${item.description}</p>
                    <p><strong>Karakter Rasa:</strong> ${item.flavor}</p>
                    <p><strong>Keunggulan:</strong> ${item.advantages}</p>
                    <p><strong>Kekurangan:</strong> ${item.disadvantages}</p>
                `;
            } else if (type === 'roasts') {
                 detailContent += `
                    <p>${item.description}</p>
                    <p><strong>Karakter Rasa:</strong> ${item.flavor}</p>
                    <p><strong>Cocok untuk:</strong> ${item.suitableFor}</p>
                `;
            } else if (type === 'brewing') {
                 detailContent += `
                    <ul class="info-list">
                        <li><strong>Grind Size:</strong> ${item.grindSize}</li>
                        <li><strong>Rasio Kopi:Air:</strong> ${item.ratio}</li>
                        <li><strong>Waktu Seduh:</strong> ${item.time}</li>
                        <li><strong>Karakter Rasa:</strong> ${item.flavor}</li>
                    </ul>
                `;
            } else if (type === 'drinks') {
                 detailContent += `
                    <p>${item.composition}</p>
                    <p><strong>Karakter Rasa:</strong> ${item.flavor}</p>
                `;
            }
            showModal(detailContent);
        });

        return card;
    };
    
    const createArticleCard = (article) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.innerHTML = `
            <img src="${article.image}" alt="${article.title}" class="card-img">
            <div class="card-body">
                <h3>${article.title}</h3>
                <p>${article.summary}</p>
    });
</script>
